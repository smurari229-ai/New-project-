name: Temporary targeted TypeScript fix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'smurari229-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply targeted App.tsx type fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''  // Compute matching count from the compact index; hydrate verbose metadata only for search.\n  const matchingToolsCount = useMemo(() => {\n    const q = searchQuery.toLowerCase().trim();\n    const source = q ? (fullSearchMetadata ?? []) : TOOL_METADATA_INDEX;\n    return source.filter((t) => {\n      const matchesCategory = selectedCategory === "All" || selectedCategory === t.category;\n      if (!matchesCategory) return false;\n      if (!q) return true;\n      return (\n        t.title.toLowerCase().includes(q) ||\n        t.category.toLowerCase().includes(q) ||\n        `#${t.id}`.includes(q) ||\n        String(t.id) === q ||\n        (t.description && t.description.toLowerCase().includes(q)) ||\n        (t.keywords && t.keywords.some((k) => k.toLowerCase().includes(q)))\n      );\n    }).length;\n  }, [searchQuery, selectedCategory, fullSearchMetadata]);\n'''
          new = '''  // Compute matching count from the compact index; use verbose metadata only when searching.\n  const matchingToolsCount = useMemo(() => {\n    const q = searchQuery.toLowerCase().trim();\n\n    if (!q) {\n      return TOOL_METADATA_INDEX.filter((t) =>\n        selectedCategory === "All" || selectedCategory === t.category\n      ).length;\n    }\n\n    const source = fullSearchMetadata ?? [];\n    return source.filter((t) => {\n      const matchesCategory = selectedCategory === "All" || selectedCategory === t.category;\n      if (!matchesCategory) return false;\n      return (\n        t.title.toLowerCase().includes(q) ||\n        t.category.toLowerCase().includes(q) ||\n        `#${t.id}`.includes(q) ||\n        String(t.id) === q ||\n        (t.description && t.description.toLowerCase().includes(q)) ||\n        (t.keywords && t.keywords.some((k) => k.toLowerCase().includes(q)))\n      );\n    }).length;\n  }, [searchQuery, selectedCategory, fullSearchMetadata]);\n'''
          if old not in s:
              raise SystemExit('Expected target block not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify targeted change
        run: |
          grep -n "if (!q)" src/App.tsx
          git diff --check

      - name: Commit targeted fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm .github/workflows/temporary-targeted-type-fix.yml
          git commit -m "fix: type-safe compact tool search count"
          git push
