name: Temporary dynamic metadata audit

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor == 'smurari229-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare live dynamic registry with generated metadata
        run: |
          npx tsx -e '
          import { DYNAMIC_METADATA_LIST } from "./src/data/tools850/index";
          import { DYNAMIC_TOOL_METADATA } from "./src/data/generatedToolMetadata";
          const live = new Map(DYNAMIC_METADATA_LIST.map((x) => [x.id, x]));
          const generated = new Map(DYNAMIC_TOOL_METADATA.map((x) => [x.id, x]));
          const mismatches = [];
          for (const [id, actual] of live) {
            const copy = generated.get(id);
            if (!copy || actual.title !== copy.title || actual.category !== copy.category || actual.description !== copy.description || JSON.stringify(actual.keywords ?? []) !== JSON.stringify(copy.keywords ?? [])) {
              mismatches.push({id, actual:{title:actual.title,category:actual.category,description:actual.description,keywords:actual.keywords}, generated:copy ? {title:copy.title,category:copy.category,description:copy.description,keywords:copy.keywords} : null});
            }
          }
          for (const id of generated.keys()) if (!live.has(id)) mismatches.push({id, actual:null, generated:generated.get(id)});
          console.log(`Live dynamic metadata: ${live.size}`);
          console.log(`Generated dynamic metadata: ${generated.size}`);
          console.log(`Mismatches: ${mismatches.length}`);
          for (const item of mismatches.slice(0,100)) console.log(JSON.stringify(item));
          if (live.size !== 850 || generated.size !== 850 || mismatches.length) process.exit(2);
          '
