name: Temporary component quality audit

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor == 'smurari229-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare first 150 UI tools with metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const metadata = JSON.parse(execFileSync('npx', ['tsx', '-e', 'import { ALL_TOOLS_METADATA } from "./src/data/toolsMetadata"; console.log(JSON.stringify(ALL_TOOLS_METADATA.slice(0,150)))'], {encoding:'utf8'}));
          const byId = new Map(metadata.map(t => [t.id, t]));
          const files = [
            'src/components/tools/ToolsTextFormat.tsx',
            'src/components/tools/ToolsMathCalculators.tsx',
            'src/components/tools/ToolsDataWeb.tsx',
            'src/components/tools/ToolsAdvancedDev.tsx',
          ];
          const found = new Map();
          for (const file of files) {
            const s = fs.readFileSync(file, 'utf8');
            const re = /<ToolCard\b[^>]*?id=\{(\d+)\}[\s\S]*?title="([^"]+)"[\s\S]*?category="([^"]+)"/g;
            let m;
            while ((m = re.exec(s))) {
              const id = Number(m[1]);
              if (id <= 150) found.set(id, {title:m[2], category:m[3], file});
            }
          }
          const missing = [];
          const mismatches = [];
          for (let id = 1; id <= 150; id++) {
            if (!found.has(id)) missing.push(id);
            const ui = found.get(id), meta = byId.get(id);
            if (ui && meta && (ui.title.trim() !== meta.title.trim() || ui.category !== meta.category)) {
              mismatches.push({id, ui, metadata:{title:meta.title, category:meta.category}});
            }
          }
          console.log(`UI ToolCard IDs discovered: ${found.size}/150`);
          console.log(`Missing UI IDs: ${missing.length ? missing.join(', ') : 'none'}`);
          console.log(`Metadata/UI title-category mismatches: ${mismatches.length}`);
          for (const x of mismatches.slice(0,50)) console.log(JSON.stringify(x));
          if (missing.length || mismatches.length) process.exit(2);
          NODE
