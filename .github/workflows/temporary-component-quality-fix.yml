name: Temporary component quality fix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'smurari229-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align first 150 metadata titles with the actual UI
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const files = [
            'src/components/tools/ToolsTextFormat.tsx',
            'src/components/tools/ToolsMathCalculators.tsx',
            'src/components/tools/ToolsDataWeb.tsx',
            'src/components/tools/ToolsAdvancedDev.tsx',
          ];
          const uiById = new Map();
          for (const file of files) {
            const s = fs.readFileSync(file, 'utf8');
            const re = /<ToolCard\b[^>]*?id=\{(\d+)\}[\s\S]*?title="([^"]+)"[\s\S]*?category="([^"]+)"/g;
            let m;
            while ((m = re.exec(s))) {
              const id = Number(m[1]);
              if (id >= 2 && id <= 150) uiById.set(id, {title:m[2], category:m[3]});
            }
          }

          const metadataSource = fs.readFileSync('src/data/toolsMetadata.ts', 'utf8');
          let patched = metadataSource;
          let changed = 0;
          for (const [id, ui] of uiById) {
            const pattern = new RegExp('(\\{\\s*"id":\\s*' + id + ',\\s*"title":\\s*")([^"\\n]*)(")');
            if (!pattern.test(patched)) throw new Error(`Static metadata entry ${id} was not found; refusing to modify.`);
            const next = patched.replace(pattern, `$1${ui.title.replaceAll('\\"','\\\\"')}$3`);
            if (next !== patched) changed++;
            patched = next;
          }
          fs.writeFileSync('src/data/toolsMetadata.ts', patched);
          console.log(`Aligned ${changed} first-150 metadata titles.`);

          const compact = execFileSync('npx', ['tsx', '-e', 'import { ALL_TOOLS_METADATA } from "./src/data/toolsMetadata"; console.log(JSON.stringify(ALL_TOOLS_METADATA.map(({id,title,category}) => ({id,title,category})))'], {encoding:'utf8'}).trim();
          const indexContent = `// Generated compact browser index. Full descriptions/keywords remain lazy-loaded for search.\nexport const TOOL_METADATA_INDEX = ${compact};\n`;
          fs.writeFileSync('src/data/toolMetadataIndex.ts', indexContent);
          NODE
      - name: Verify targeted metadata alignment
        run: |
          npm run lint
          npx tsx -e 'import { ALL_TOOLS_METADATA } from "./src/data/toolsMetadata"; console.log(`Metadata entries: ${ALL_TOOLS_METADATA.length}`); if (ALL_TOOLS_METADATA.length !== 1000) process.exit(2)'
          git diff --check
      - name: Commit targeted metadata fix and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/toolsMetadata.ts src/data/toolMetadataIndex.ts
          git rm .github/workflows/temporary-component-quality-fix.yml .github/workflows/temporary-component-quality-audit.yml .audit-component-trigger
          git commit -m "fix: align tool metadata with first-150 UI titles"
          git push
