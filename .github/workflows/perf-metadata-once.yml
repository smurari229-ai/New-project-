name: One-time metadata performance hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compact-metadata:
    if: ${{ !contains(github.event.head_commit.message, '[metadata-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build compact browser metadata index and patch App
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function loadExportFromTs(file, exportName) {
            let src = fs.readFileSync(file, 'utf8');
            src = src.replace(/^import[^\n]*\n/gm, '');
            src = src.replace(/export const /g, 'const ');
            src = src.replace(/:\s*ToolMetadata(?:\[\])?/g, '');
            src = src.replaceAll('as const', '');
            src += `\nmodule.exports = ${exportName};\n`;
            const context = { module: { exports: {} } };
            vm.runInNewContext(src, context, { filename: file });
            return context.module.exports;
          }

          const dynamic = loadExportFromTs('src/data/generatedToolMetadata.ts', 'DYNAMIC_TOOL_METADATA');
          const staticMetadata = loadExportFromTs('src/data/toolsMetadata.ts', 'STATIC_TOOLS_METADATA');
          const all = [...staticMetadata, ...dynamic];
          const index = all.map(({id, title, category}) => ({id, title, category}));
          const seen = new Set();
          for (const item of index) {
            if (seen.has(item.id)) throw new Error(`Duplicate tool id ${item.id}`);
            seen.add(item.id);
          }
          if (index.length !== 1000 || seen.size !== 1000) throw new Error(`Expected 1000 unique metadata entries, got ${index.length}`);
          fs.writeFileSync('src/data/toolMetadataIndex.ts', `// Generated compact browser index. Full descriptions/keywords remain lazy-loaded for search.\nexport const TOOL_METADATA_INDEX = ${JSON.stringify(index)};\n`);

          const appPath = 'src/App.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          if (!app.includes('import { ALL_TOOLS_METADATA } from "./data/toolsMetadata";')) throw new Error('Expected App metadata import not found');
          app = app.replace('import { ALL_TOOLS_METADATA } from "./data/toolsMetadata";', 'import type { ToolMetadata } from "./types";\nimport { TOOL_METADATA_INDEX } from "./data/toolMetadataIndex";');
          app = app.replace('  const [incomingAiQuery, setIncomingAiQuery] = useState("");', '  const [incomingAiQuery, setIncomingAiQuery] = useState("");\n  const [fullSearchMetadata, setFullSearchMetadata] = useState<ToolMetadata[] | null>(null);');
          app = app.replace(/ALL_TOOLS_METADATA/g, 'TOOL_METADATA_INDEX');
          const oldBlock = `  // Compute number of matching tools for active search & category\n  const matchingToolsCount = useMemo(() => {\n    const q = searchQuery.toLowerCase().trim();\n    return TOOL_METADATA_INDEX.filter((t) => {\n      const matchesCategory =\n        selectedCategory === "All" || selectedCategory === t.category;\n      if (!matchesCategory) return false;\n      if (!q) return true;\n      return (\n        t.title.toLowerCase().includes(q) ||\n        t.category.toLowerCase().includes(q) ||\n        \`#\${t.id}\`.includes(q) ||\n        String(t.id) === q ||\n        (t.description && t.description.toLowerCase().includes(q)) ||\n        (t.keywords && t.keywords.some((k) => k.toLowerCase().includes(q)))\n      );\n    }).length;\n  }, [searchQuery, selectedCategory]);`;
          const newBlock = `  // Load verbose descriptions/keywords only when a real text search needs them.\n  useEffect(() => {\n    if (!searchQuery.trim()) {\n      setFullSearchMetadata(null);\n      return;\n    }\n    let cancelled = false;\n    import("./data/toolsMetadata").then(({ ALL_TOOLS_METADATA }) => {\n      if (!cancelled) setFullSearchMetadata(ALL_TOOLS_METADATA);\n    }).catch(() => {\n      if (!cancelled) setFullSearchMetadata([]);\n    });\n    return () => { cancelled = true; };\n  }, [searchQuery]);\n\n  // Compute matching count from the compact index; hydrate verbose metadata only for search.\n  const matchingToolsCount = useMemo(() => {\n    const q = searchQuery.toLowerCase().trim();\n    const source = q ? (fullSearchMetadata ?? []) : TOOL_METADATA_INDEX;\n    return source.filter((t) => {\n      const matchesCategory = selectedCategory === "All" || selectedCategory === t.category;\n      if (!matchesCategory) return false;\n      if (!q) return true;\n      return (\n        t.title.toLowerCase().includes(q) ||\n        t.category.toLowerCase().includes(q) ||\n        \`#\${t.id}\`.includes(q) ||\n        String(t.id) === q ||\n        (t.description && t.description.toLowerCase().includes(q)) ||\n        (t.keywords && t.keywords.some((k) => k.toLowerCase().includes(q)))\n      );\n    }).length;\n  }, [searchQuery, selectedCategory, fullSearchMetadata]);`;
          if (!app.includes(oldBlock)) throw new Error('Expected matchingToolsCount block not found after import patch');
          app = app.replace(oldBlock, newBlock);
          fs.writeFileSync(appPath, app);
          NODE
      - name: Verify targeted change
        run: |
          test -s src/data/toolMetadataIndex.ts
          grep -q 'TOOL_METADATA_INDEX' src/App.tsx
          grep -q 'import("./data/toolsMetadata")' src/App.tsx
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/data/toolMetadataIndex.ts','utf8'); if(!s.includes('1000')) process.exit(1)"
      - name: Commit targeted performance hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/data/toolMetadataIndex.ts
          git diff --cached --check
          git commit -m 'perf: lazy-load verbose tool metadata [metadata-hardening]'
          git push
