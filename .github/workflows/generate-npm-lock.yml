name: Generate npm lockfile

on:
  push:
    branches: ["npm-lock-hardening-2026-09-15"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ci: add npm lockfile"
          git push
