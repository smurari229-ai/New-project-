name: Split tool metadata

on:
  push:
    branches: ["perf-split-tool-metadata-2026-09-15"]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate lightweight dynamic metadata module
        run: |
          npx tsx <<'TS'
          import { writeFileSync } from 'node:fs';
          import { ALL_850_TOOLS } from './src/data/tools850/index.ts';
          const metadata = ALL_850_TOOLS.map((t) => ({
            id: t.id,
            title: t.title,
            category: t.category,
            description: t.description,
            keywords: t.keywords,
          }));
          writeFileSync(
            'src/data/generatedToolMetadata.ts',
            `export const DYNAMIC_TOOL_METADATA = ${JSON.stringify(metadata, null, 2)};\n`,
          );
          TS

      - name: Disconnect browser metadata from executable registry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/data/toolsMetadata.ts')
          s = p.read_text()
          old = 'import { DYNAMIC_METADATA_LIST } from "./tools850";'
          new = 'import { DYNAMIC_TOOL_METADATA } from "./generatedToolMetadata";\n\nconst DYNAMIC_METADATA_LIST = DYNAMIC_TOOL_METADATA;'
          if old not in s:
              raise SystemExit('Expected toolsMetadata import not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit generated metadata split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generatedToolMetadata.ts src/data/toolsMetadata.ts
          git commit -m "perf: split executable tool registry from metadata" || true
          git push
