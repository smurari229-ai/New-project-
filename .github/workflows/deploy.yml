name: Build Check

on:
  push:
    branches: ["main", "repair-tools-956-1000-2026-09-14", "hardening-ci-lockfile-2026-09-15"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from npm lockfile
        run: npm ci

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: TypeScript check
        run: npm run lint

      - name: Tool source integrity
        run: node scripts/verify-tools.mjs

      - name: 956-1000 repair smoke check
        run: node scripts/repair-smoke-tests.mjs

      - name: Dynamic tool quality regression check
        run: npx tsx scripts/quality-tool-smoke.ts

      - name: Specialized semantic regression check
        run: npx tsx scripts/specialized-semantic-smoke.ts

      - name: 1-1000 runtime smoke check
        run: npx tsx scripts/runtime-tool-smoke.ts

      - name: Build project
        run: npm run build

      - name: Phase 4 browser and mobile acceptance
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.63.0
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.phase4.config.ts
