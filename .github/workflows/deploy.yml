name: Build Check

on:
  push:
    branches: ["main", "repair-tools-956-1000-2026-09-14", "hardening-ci-lockfile-2026-09-15"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Tool source integrity
        run: bun run scripts/verify-tools.mjs

      - name: 956-1000 repair smoke check
        run: bun run scripts/repair-smoke-tests.mjs

      - name: 1-1000 runtime smoke check
        run: bunx tsx scripts/runtime-tool-smoke.ts

      - name: Build project
        run: bun run build
