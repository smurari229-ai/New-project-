name: Temporary Final Tool Quality Smoke

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Final tool quality smoke
        run: npx tsx scripts/quality-runner-smoke.ts
      - name: Full runtime smoke
        run: npx tsx scripts/runtime-tool-smoke.ts
      - name: Production build
        run: npm run build
